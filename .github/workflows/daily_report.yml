 name: Daily Content Report        

  'on':
    schedule:
      - cron: '10 22 * * *'
    workflow_dispatch:

  jobs:
    send-report:
      runs-on: ubuntu-latest        
      steps:
        - name: Checkout
          uses: actions/checkout@v4 
        - name: Set up Python       
          uses:
  actions/setup-python@v5
          with:
            python-version: '3.11'  
        - name: Install dependencies
          run: pip install -r       
  requirements.txt
        - name: Run report
          env:
            ANTHROPIC_API_KEY: ${{  
  secrets.ANTHROPIC_API_KEY }}      
            TELEGRAM_BOT_TOKEN: ${{ 
  secrets.TELEGRAM_BOT_TOKEN }}     
            TELEGRAM_CHAT_ID: ${{   
  secrets.TELEGRAM_CHAT_ID }}       
          run: python main.py     
