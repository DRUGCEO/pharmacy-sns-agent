name: Daily Content Report        
  on: [workflow_dispatch]
  jobs:
    send-report:
      runs-on: ubuntu-latest        
      steps:
        - uses: actions/checkout@v4 
        - uses:
  actions/setup-python@v5
          with:
            python-version: "3.11"  
        - run: pip install -r       
  requirements.txt
        - run: python main.py       
          env:
            ANTHROPIC_API_KEY: ${{  
  secrets.ANTHROPIC_API_KEY }}      
            TELEGRAM_BOT_TOKEN: ${{ 
  secrets.TELEGRAM_BOT_TOKEN }}     
            TELEGRAM_CHAT_ID: ${{   
  secrets.TELEGRAM_CHAT_ID }}
