/.github/workflows/daily_report.yml

name: 매일 글감 리포트 전송       

  on:
    schedule:
      - cron: '10 22 * * *'
    workflow_dispatch:

  jobs:
    send-report:
      runs-on: ubuntu-latest        
      steps:
        - name: 코드 내려받기       
          uses: actions/checkout@v4 

        - name: Python 3.11 설정    
          uses:
  actions/setup-python@v5
          with:
            python-version: '3.11'  

        - name: 패키지 설치
          run: pip install -r       
  requirements.txt

        - name: 글감 리포트 실행 및 
  전송
          env:
            ANTHROPIC_API_KEY: ${{  
  secrets.ANTHROPIC_API_KEY }}      
            TELEGRAM_BOT_TOKEN: ${{ 
  secrets.TELEGRAM_BOT_TOKEN }}     
            TELEGRAM_CHAT_ID: ${{   
  secrets.TELEGRAM_CHAT_ID }}       
          run: python main.py  
